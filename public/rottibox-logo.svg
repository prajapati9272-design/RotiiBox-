<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <!-- Dark Chocolate Badge Background Gradient -->
    <linearGradient id="badgeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1309"/>
      <stop offset="50%" stop-color="#1A0A04"/>
      <stop offset="100%" stop-color="#2D1309"/>
    </linearGradient>

    <!-- Gold & Flame Border Gradient -->
    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Roti Surface Radial Gradient -->
    <radialGradient id="rotiSurfaceGrad" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <!-- Flame Accent Gradient -->
    <linearGradient id="flameDotGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="rotiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Charred Roti Spot Group -->
    <g id="rotiCharSpots">
      <circle cx="0" cy="0" r="3.5" fill="#B45309" opacity="0.8"/>
      <circle cx="0" cy="0" r="2" fill="#451A03"/>

      <circle cx="-6" cy="-5" r="4" fill="#B45309" opacity="0.8"/>
      <circle cx="-6" cy="-5" r="2.2" fill="#451A03"/>

      <circle cx="7" cy="-4" r="4.2" fill="#B45309" opacity="0.8"/>
      <circle cx="7" cy="-4" r="2.4" fill="#451A03"/>

      <circle cx="-7" cy="7" r="3.5" fill="#B45309" opacity="0.8"/>
      <circle cx="-7" cy="7" r="2" fill="#451A03"/>

      <circle cx="6" cy="8" r="3.8" fill="#B45309" opacity="0.8"/>
      <circle cx="6" cy="8" r="2.2" fill="#451A03"/>
    </g>
  </defs>

  <!-- Badge Container Box -->
  <rect x="6" y="6" width="588" height="148" rx="28" fill="url(#badgeBgGrad)" stroke="url(#badgeBorderGrad)" stroke-width="3.5"/>

  <!-- Subtle Corner Glow Accent -->
  <circle cx="80" cy="80" r="70" fill="url(#rotiGlow)"/>

  <!-- Left Icon Emblem: Delivery Box with Puffed Tawa Roti -->
  <g transform="translate(24, 25)">
    <!-- Box Frame -->
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#3D180C" stroke="#D97706" stroke-width="2.5"/>
    
    <!-- Puffed Roti in Center -->
    <circle cx="55" cy="55" r="38" fill="url(#rotiSurfaceGrad)"/>
    
    <!-- Charred Spots on Emblem Roti -->
    <g transform="translate(55, 55)">
      <use href="#rotiCharSpots" scale="1.3"/>
    </g>

    <!-- Steam Wisps Above Box -->
    <path d="M 42 12 Q 46 6 42 2" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 55 10 Q 59 4 55 0" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 68 12 Q 72 6 68 2" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Main Wordmark: ROTIIBOX -->
  <g transform="translate(150, 15)">
    
    <!-- =========================================
         CAPITAL "R" WITH EXTENDED SWEEP TAIL BELOW WORDMARK TILL END "x"
         ========================================= -->
    <path d="M 10 30 H 48 C 66 30 78 40 78 54 C 78 65 70 73 58 76 L 74 95 C 82 103 98 113 125 118 C 160 124 260 125 412 125 C 422 125 428 120 428 115 C 428 110 420 113 410 114 C 260 114 160 113 122 108 C 98 105 85 96 76 87 L 44 76 H 28 V 102 C 28 106 24 109 20 109 C 16 109 10 106 10 102 V 30 Z M 28 43 V 63 H 46 C 54 63 60 60 60 54 C 60 48 54 43 46 43 H 28 Z" fill="#FFF8EB"/>

    <!-- =========================================
         FIRST FRESH ROTI ('o') Center X=120, Y=70, R=25
         ========================================= -->
    <g transform="translate(120, 70)">
      <circle cx="0" cy="0" r="26" fill="#3D180C"/>
      <circle cx="0" cy="0" r="23" fill="url(#rotiSurfaceGrad)"/>
      <use href="#rotiCharSpots"/>
    </g>

    <!-- =========================================
         LETTER "t" Stem X=168, Crossbar Y=52
         ========================================= -->
    <path d="M 168 40 V 93 C 168 100 174 104 182 104" stroke="#FFF8EB" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 156 52 H 182" stroke="#FFF8EB" stroke-width="12" stroke-linecap="round"/>

    <!-- =========================================
         TWIN "ii" WITH GLOWING FLAME DOTS
         ========================================= -->
    <!-- First 'i' -->
    <rect x="194" y="52" width="13" height="48" rx="6.5" fill="#FFF8EB"/>
    <circle cx="200.5" cy="33" r="10" fill="url(#flameDotGrad)"/>
    <circle cx="200.5" cy="33" r="5" fill="#FEF08A"/>

    <!-- Second 'i' -->
    <rect x="216" y="52" width="13" height="48" rx="6.5" fill="#FFF8EB"/>
    <circle cx="222.5" cy="33" r="10" fill="url(#flameDotGrad)"/>
    <circle cx="222.5" cy="33" r="5" fill="#FEF08A"/>

    <!-- =========================================
         CAPITAL LETTER "B" X=240..290
         ========================================= -->
    <path d="M 242 30 H 272 C 285 30 294 37 294 48 C 294 56 288 62 280 64 C 290 67 297 75 297 87 C 297 99 286 106 270 106 H 242 C 237 106 234 102 234 97 V 39 C 234 34 237 30 242 30 Z M 250 42 V 58 H 268 C 274 58 278 55 278 50 C 278 45 274 42 268 42 H 250 Z M 250 69 V 94 H 269 C 276 94 281 89 281 82 C 281 75 276 69 269 69 H 250 Z" fill="#FFF8EB"/>

    <!-- =========================================
         SECOND FRESH ROTI ('o') Center X=332, Y=70, R=25
         ========================================= -->
    <g transform="translate(332, 70)">
      <circle cx="0" cy="0" r="26" fill="#3D180C"/>
      <circle cx="0" cy="0" r="23" fill="url(#rotiSurfaceGrad)"/>
      <use href="#rotiCharSpots"/>
    </g>

    <!-- =========================================
         LETTER "x" X=372..402 (Top Y=52, Bottom Y=98)
         R-TAIL SWEEPS TILL X=412 BELOW 'x'
         ========================================= -->
    <path d="M 372 52 L 402 98" stroke="#FFF8EB" stroke-width="14" stroke-linecap="round"/>
    <path d="M 402 52 L 372 98" stroke="#FFF8EB" stroke-width="14" stroke-linecap="round"/>

  </g>
</svg>
